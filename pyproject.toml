[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiald"
version = "0.4.0"
description = "Authority-safe concurrent compute sharing with evidence-bound weak-link assurance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AltruDev"}]
keywords = ["concurrency", "deduplication", "singleflight", "compute", "scheduler", "dag", "pipeline", "assurance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
radiald = "radiald.cli:main"

[tool.setuptools]
packages = ["radiald"]
