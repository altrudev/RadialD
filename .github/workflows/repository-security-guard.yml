name: Repository Security Guard

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  anti-siphon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-pinned YAML parser
        run: python -m pip install --only-binary ':all:' --require-hashes -r .github/scripts/guard-requirements.txt
      - name: Self-test the guard
        run: python .github/scripts/test_repository_security_guard.py
      - name: Scan workflow trust boundary
        run: python .github/scripts/repository_security_guard.py
